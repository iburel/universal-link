name: Release

# On a `v*` tag: builds the three desktop installers and the Android APK, and
# publishes a Release (as a draft, to review before publishing). On
# `workflow_dispatch`: builds and uploads them as run ARTIFACTS, without publishing
# anything — to test the chain end to end before laying down a real tag. That dry
# run exercises the signing key too, so a broken keystore secret is caught without
# a tag to delete.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Write access is needed to create the Release and attach files to it. The
# build job alone (workflow_dispatch) does not need it, but the scope is set at
# the workflow level; the publish step is gated on tags.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # linuxdeploy/appimagetool (used by the AppImage bundler) are themselves
  # AppImages; on a runner without a usable FUSE mount they fail to self-mount.
  # This makes them extract-and-run instead. No effect off Linux.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  bundle:
    name: ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    # Cold compile of the tauri + iroh tree plus installing tauri-cli.
    timeout-minutes: 60
    strategy:
      # One OS failing must not cancel the other: we want at least one installer
      # produced even if the other platform breaks.
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon only (milestone 1 scope). macos-14 = arm64.
          - os: macos-14
            triple: aarch64-apple-darwin
            bin_ext: ""
            bundles: dmg
            bundle_glob: target/release/bundle/dmg/*.dmg
          # Windows x64.
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            bin_ext: ".exe"
            bundles: nsis
            bundle_glob: target/release/bundle/nsis/*-setup.exe
          # Linux x64. Built on 22.04 (NOT ubuntu-latest/24.04): an AppImage
          # links against the build host's glibc, so building on the newer
          # image would refuse to start on Debian 12 / Ubuntu 22.04. 22.04 =
          # glibc 2.35, a reasonable floor. AppImage = portable single file,
          # no root — the Linux analogue of the unsigned per-user dmg/nsis.
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            bin_ext: ""
            bundles: appimage
            bundle_glob: target/release/bundle/appimage/*.AppImage
    steps:
      # Actions pinned to a SHA (the only immutable reference), as in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Windows only: Defender's real-time protection scans each of the many
      # small files rustc/link.exe write, which taxes the build. The runner is
      # ephemeral and compiles only our own code, so turning the scan off has no
      # real security impact here.
      - name: Disable Defender real-time protection (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      # Linux only. The webkit/gtk -dev packages (as in ci.yml) let the GUI
      # link, plus the extras the AppImage bundler needs: librsvg (icon
      # rendering), file + patchelf (linuxdeploy rewrites rpaths), and libfuse2
      # (the AppImage runtime). libxcb + xcb-xfixes -dev let the clipboard
      # sidecar link (the `xcb` crate binds the system libxcb; xfixes drives the
      # selection-owner notifications). The webkit/gtk libraries are bundled INTO
      # the AppImage, so the end user's machine does not need them — only the
      # build host; libxcb is present on every X11/XWayland desktop at runtime.
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            file patchelf libfuse2 \
            libxcb1-dev libxcb-xfixes0-dev

      - name: Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          # Same as ci.yml: the project's MSRV (iroh 1.x).
          toolchain: "1.97.0"
          rustflags: ""

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/ui/package-lock.json

      # `ui/dist` is embedded into the webview binary by generate_context!;
      # tauri does not rebuild it (no beforeBuildCommand) — we do it here.
      - name: Frontend
        working-directory: gui/ui
        shell: bash
        run: |
          npm ci
          npm run build

      # The CLI that drives the bundling. Built from crates.io (no extra
      # third-party action to pin).
      - name: tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked

      # The Core, a separate binary, embedded as a sidecar. Release + --locked
      # like the rest. NOTHING is baked in — no server URL, no OIDC client, no
      # secret: the installer ships blank, and the user configures their
      # deployment from the GUI's first-run setup screen (which writes
      # config.json; the Core only reads it). This is deliberate — the released
      # binaries must carry no credentials.
      - name: Build the Core (sidecar)
        run: cargo build -p universallink-daemon --bin universallink-core --release --locked

      # The tray, a second sidecar next to the Core. Same flags; on Linux it
      # dlopens libappindicator at runtime, so there is no extra build-time
      # system dependency here.
      - name: Build the tray (sidecar)
        run: cargo build -p universallink-tray --bin universallink-tray --release --locked

      # The clipboard backend, a third sidecar. The Core's supervisor looks it up
      # next to itself and spawns it (`official_components`); without it the Core
      # runs but ships no clipboard. Same flags. Its per-OS system libraries are
      # loaded at runtime, not linked-and-bundled here: on Linux the host libxcb
      # (build dep above), on Windows/macOS the OS Win32/AppKit already present.
      - name: Build the clipboard backend (sidecar)
        run: cargo build -p universallink-clipboard --bin universallink-clipboard --release --locked

      # Tauri expects each sidecar named with the target triple, next to the GUI.
      - name: Stage the sidecars
        shell: bash
        run: |
          mkdir -p gui/binaries
          cp "target/release/universallink-core${{ matrix.bin_ext }}" \
             "gui/binaries/universallink-core-${{ matrix.triple }}${{ matrix.bin_ext }}"
          cp "target/release/universallink-tray${{ matrix.bin_ext }}" \
             "gui/binaries/universallink-tray-${{ matrix.triple }}${{ matrix.bin_ext }}"
          cp "target/release/universallink-clipboard${{ matrix.bin_ext }}" \
             "gui/binaries/universallink-clipboard-${{ matrix.triple }}${{ matrix.bin_ext }}"

      # `externalBin` is injected HERE (and not in tauri.conf.json) so that the
      # `cargo build`/clippy runs in ci.yml don't require the sidecar to be
      # present: tauri's build script validates its existence at compile time.
      - name: Build the installer
        working-directory: gui
        shell: bash
        run: |
          cargo tauri build --features webview --bundles ${{ matrix.bundles }} \
            --config '{"bundle":{"externalBin":["binaries/universallink-core","binaries/universallink-tray","binaries/universallink-clipboard"]}}'

      # Always: retrievable from the run (tests the chain without a tag).
      - name: Run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: universallink-${{ matrix.triple }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error

      # Only on a tag: publishes (as a draft) to the tag's Release. A draft
      # because the binaries are UNSIGNED (milestone 1) — to review and complete
      # with Gatekeeper/SmartScreen workaround instructions before publishing.
      - name: Publish to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          files: ${{ matrix.bundle_glob }}
          fail_on_unmatched_files: true
          body: |
            UniversalLink installers — **unsigned** (milestone 1). The OS will show a warning on first launch:

            - **macOS**: "unverified developer" → System Settings → Privacy & Security → "Open anyway".
            - **Windows**: SmartScreen "Windows protected your PC" → "More info" → "Run anyway".
            - **Linux** (AppImage): `chmod +x UniversalLink_*.AppImage`, then run it. If it fails to start with a `libfuse.so.2` error, install FUSE 2 (`sudo apt install libfuse2`, or your distro's equivalent). The tray icon additionally needs `libayatana-appindicator3` (`sudo apt install libayatana-appindicator3-1`) and a StatusNotifierItem host — on GNOME, the AppIndicator extension.
            - **Android** (`.apk`, **arm64 only** — a 32-bit-only phone will refuse it with `INSTALL_FAILED_NO_MATCHING_ABIS`): this one *is* signed, with the project's own key, because Android will not install or upgrade an app otherwise. That key is self-issued, so your phone still asks you to allow installs from whatever app you downloaded it with, and Play Protect may offer to scan it. Sideload only: it is not on the Play Store. Requires Android 7.0 or newer.

            On first launch, the app installs the background service (per-user, no admin) and opens a setup screen: enter your UniversalLink server address and its OpenID Connect client (nothing is baked into the build). It then connects.

  # The Android client, in a job of its own rather than a fourth leg of the matrix
  # above: it shares not one step with it (no sidecars — the mobile app embeds the
  # Core in-process — and no desktop bundler) and needs a toolchain none of the
  # three do. ci.yml's `android` job builds this same APK UNSIGNED on every push as
  # a gate; this job is the shipping artifact, and the only place the signing key is
  # ever used.
  apk:
    name: android-arm64
    runs-on: ubuntu-latest
    # Deliberately without the Rust cache (see the toolchain step), so this is a
    # cold compile of the tauri + iroh tree plus tauri-cli from source. ci.yml's
    # equivalent fits in 45 even cold; the margin is here because a release must
    # not fail on a timeout.
    timeout-minutes: 60
    env:
      # Pinned exactly as in ci.yml, for the same reason: the runner image ships
      # whichever NDK it ships, and that moves between image releases. Dependabot
      # has no Android-SDK ecosystem, so this is bumped by hand — keep the two
      # workflows in step.
      NDK_VERSION: "26.3.11579264"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # FIRST, before spending 40 minutes: `cargo tauri android build` rewrites
      # app/tauri.properties from gui-mobile/tauri.conf.json's OWN `version` on
      # every run (tauri-cli, src/mobile/android/mod.rs::generate_tauri_properties)
      # and derives versionCode = major*1000000 + minor*1000 + patch from it. The
      # git tag is never consulted. So a v0.4.0 tag cut while that file still reads
      # 0.3.0 ships versionCode 3000 a second time, and Android refuses an APK whose
      # versionCode is not strictly GREATER than the installed one: the release would
      # look perfectly fine and be uninstallable for everyone who already has the
      # app. gui-mobile/tauri.conf.json carries its own version, separate from
      # gui/tauri.conf.json — bumping one and not the other is the easy mistake.
      - name: The mobile version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf="$(jq -r .version gui-mobile/tauri.conf.json)"
          if [ "$tag" != "$conf" ]; then
            echo "::error::tag $GITHUB_REF_NAME vs gui-mobile/tauri.conf.json version $conf. Bump that file, or the APK ships the previous release's versionCode and cannot be installed over it."
            exit 1
          fi

      - name: Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.97.0"
          target: aarch64-linux-android
          rustflags: ""
          # No Rust cache on purpose. This workflow runs on a tag, i.e. a handful of
          # times a year, while ci.yml's caches are what every push depends on — and
          # the repository's 10 GiB cache budget is shared and already evicts under
          # pressure. A fresh multi-hundred-megabyte entry here would buy ten minutes
          # once and cost a cold matrix on the next push.
          cache: false

      # AGP needs JDK 17+; 21 is what the app is developed against. Before the SDK
      # step, which runs sdkmanager — itself a Java program.
      - name: Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK components
        run: |
          # sdkmanager is not on PATH on the runner; take the newest cmdline-tools.
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/ui/package-lock.json

      # Must precede the Rust build: gui-mobile's generate_context! resolves
      # `frontendDist` (../gui/ui/dist-mobile) AT COMPILE TIME and its proc macro
      # panics if the directory is absent — which it is on a checkout, dist-mobile
      # being generated. `build:mobile` is the relative-base variant the webview
      # needs; the desktop `build` above is a different output directory.
      - name: Frontend
        working-directory: gui/ui
        shell: bash
        run: |
          npm ci
          npm run build:mobile

      # Only tauri-cli here, unlike ci.yml which also installs cargo-ndk: cargo-ndk
      # serves ci.yml's clippy step alone (it exports the NDK's clang and ar for a
      # bare `cargo` invocation). This job never runs clippy, and the CLI configures
      # the Android linkers itself before driving Gradle.
      - name: tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked

      # A committed gen/android is NOT self-sufficient: settings.gradle applies
      # tauri.settings.gradle, which is gitignored because it holds ABSOLUTE paths
      # into ~/.cargo/registry. Same for app/tauri.properties, app/proguard-tauri.pro,
      # app/src/main/assets/tauri.conf.json and the generated Kotlin. Of the files
      # that already exist this FORCE-REWRITES exactly one, buildSrc's BuildTask.kt,
      # and skips every other — see the version caps in .github/dependabot.yml.
      - name: Generate the Gradle project
        working-directory: gui-mobile
        run: cargo tauri android init --skip-targets-install

      # Into RUNNER_TEMP and not the workspace: nothing that globs the checkout —
      # an artifact upload, a bundler, a future step — can then pick the key up.
      # `base64 -d` fails loudly on a truncated secret, which is the failure mode of
      # a hand-copied value.
      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. A release APK must be signed: an unsigned one cannot be installed, and one signed by a different key cannot upgrade an installed app."
            exit 1
          fi
          printf %s "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      # The RELEASE variant: the shipping configuration, and the only one R8 runs on
      # (isMinifyEnabled is set on that buildType alone). `--target aarch64` because
      # the default is all FOUR ABIs, i.e. four Rust builds where every modern phone
      # uses one. `--apk` because the default also emits an AAB, which only the Play
      # Store consumes.
      #
      # The four variables are what app/build.gradle.kts reads to populate
      # signingConfigs; passwords stay in the process environment and are never
      # written to disk. Absent them the build would succeed and produce an
      # *-unsigned.apk, which is why the next step checks rather than trusts.
      - name: Build the signed APK
        working-directory: gui-mobile
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cargo tauri android build --apk --target aarch64

      # The one check that cannot be satisfied by accident. `apksigner verify` exits
      # non-zero unless the archive verifies, and --print-certs puts the signing
      # certificate's SHA-256 in the log: compare it against the fingerprint of the
      # key you meant to use (`keytool -list -v`) the first time, and any later
      # release whose fingerprint differs is a key swap, not a rebuild. A certificate
      # is public information — it ships inside every copy of the APK.
      #
      # No `--min-sdk-version`: apksigner reads minSdkVersion out of the APK's own
      # manifest (measured — it verifies the v1-less APK without the flag). Passing
      # 24 by hand would pin the floor here instead, and go on passing if the
      # manifest ever moved BELOW 24, where the disabled v1 scheme starts mattering.
      - name: Verify the signature
        run: |
          apk=gui-mobile/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::no signed APK at $apk — an unsigned build lands beside it as app-universal-release-unsigned.apk, so the signing configuration did not take effect"
            ls -l "$(dirname "$apk")" || true
            exit 1
          fi
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$apk"

      # Named like the desktop bundles (UniversalLink_<version>_<arch>.<ext>) rather
      # than shipped as Gradle's app-universal-release.apk, which says nothing to
      # someone looking at a downloads folder. A move, not a copy: what gets uploaded
      # is then byte-for-byte the file the step above verified, and the directory
      # cannot end up holding two APKs for a glob to choose between.
      - name: Name the APK
        id: named
        run: |
          version="$(jq -r .version gui-mobile/tauri.conf.json)"
          dir=gui-mobile/gen/android/app/build/outputs/apk/universal/release
          out="$dir/UniversalLink_${version}_arm64.apk"
          mv "$dir/app-universal-release.apk" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: universallink-android-arm64
          path: ${{ steps.named.outputs.path }}
          if-no-files-found: error

      # No `body:` here on purpose, unlike the matrix job: action-gh-release
      # overwrites the release body with whatever it is given, and the Android
      # paragraph lives in the matrix job's copy. Whichever job lands second would
      # otherwise erase the other's notes.
      - name: Publish to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          files: ${{ steps.named.outputs.path }}
          fail_on_unmatched_files: true
