name: CI

on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKEN read-only regardless of the repository setting: nothing here
# writes to the repo.
permissions:
  contents: read

# A new push on a PR cancels the previous run. On main it does not, but that is
# weaker than "every commit on main gets a reference build": GitHub keeps at most
# ONE run pending per concurrency group and cancels the previously pending one, so
# merging several pull requests in quick succession leaves the intermediate
# commits unbuilt. What is guaranteed is that the LATEST state of main is built —
# which is the state that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless for a one-shot compilation and
  # bloat the cache restored on every run.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # Formatting: rustfmt's output is deterministic for a given toolchain, so a
  # single Linux runner covers all three platforms. Pinned to the same 1.97.0
  # as the build matrix on purpose — a rustfmt from another toolchain wraps
  # lines differently and would report churn the build toolchain never emits.
  # A dedicated job (like `deny`) rather than a matrix step: it compiles
  # nothing, so it needs neither the webview deps nor the compilation cache.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.97.0"
          components: rustfmt
          # Nothing is compiled here: the rust-cache the action enables by
          # default would only store an empty target/ — skip it.
          cache: false

      - name: Check formatting
        run: cargo fmt --all -- --check

  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 45 min: the GUI's webview tree (wry/webkit) adds to the
    # compilation, and the iroh closure (~146 crates) makes the whole thing heavier still.
    # Bumping the toolchain to 1.97.0 invalidates all rust-cache caches:
    # the first run without cache would exceed 30 min on Windows.
    timeout-minutes: 45
    strategy:
      # The status of all three platforms, even if one fails: an OS-specific
      # bug must not mask the result of the other two.
      fail-fast: false
      matrix:
        # The only deliberately floating versions in the file: GitHub removes
        # pinned images after notice, whereas a `-latest` migrates without breaking.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Actions are pinned to the commit SHA, the only immutable reference:
      # a tag, however precise, can be redirected by its maintainer.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This action enables Swatinem/rust-cache by default (itself pinned to a
      # SHA on its side): do not add a separate cache step. `rustflags: ""`
      # neutralizes the `-D warnings` it would otherwise set on the whole job: the
      # deny-on-warnings applies only to the Clippy steps.
      - name: Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          # Pinned version, identical to the development toolchain. Bumped from
          # 1.89.0 to 1.97.0 for iroh 1.x (data plane), whose MSRV is
          # 1.91; we take the latest stable rather than the strict minimum.
          toolchain: "1.97.0"
          components: clippy
          rustflags: ""

      # The GUI (tauri crate) requires the webkit2gtk -dev packages to compile on
      # Linux — even without the webview engine, tauri-runtime links them.
      - name: System webview dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev

      # The X11 clipboard backend (universallink-clipboard) links libxcb + the
      # XFIXES extension through the `xcb` crate's FFI, so the -dev headers are
      # needed to BUILD/link it on Linux; its live-X integration tests need a
      # server, provided headless by Xvfb. DISPLAY is exported into the job env
      # so the later Build/Clippy/Tests steps inherit it. apt-get update already
      # ran in the step above (same runner), so it is not repeated here.
      - name: System X11 dependencies + headless display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends libxcb1-dev libxcb-xfixes0-dev xvfb
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/ui/package-lock.json

      # Type-checking, tests, then build: `ui/dist` is embedded into the webview
      # binary by generate_context! at the "Build GUI" step.
      # `npm run check` = `tsc --noEmit`, which covers ONLY the `.ts` files: the
      # `<script lang="ts">` of `.svelte` files is typed by nothing. svelte-check
      # would be the tool, but it drives the JS API of the TypeScript compiler,
      # which TypeScript 7 (native port) no longer exposes — to be retried later.
      # bash shell enforced: Windows' default pwsh only propagates the
      # exit code of the LAST command — a `npm test` failure
      # would be swallowed by the `npm run build` that follows.
      - name: Frontend
        working-directory: gui/ui
        shell: bash
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      # `universallink-core` must remain compilable for the three targets WITHOUT
      # a C compiler: this is what forbids the library from bundling rustls or
      # keyring, and what justifies the existence of the `daemon` crate. Lib only:
      # its dev-dependencies (server → reqwest → ring) do not cross-compile,
      # and do not need to.
      - name: Core cross-check (lib only)
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-pc-windows-msvc aarch64-apple-darwin
          cargo check -p universallink-core --locked --target x86_64-pc-windows-msvc
          cargo check -p universallink-core --locked --target aarch64-apple-darwin

      # Production build: lib and binaries ONLY, without dev-dependencies.
      # Essential, because `--all-targets` and `cargo test` unify the
      # dev-dependencies' features onto the normal dependencies — an
      # unbuildable prod binary can therefore pass all the other
      # steps green (seen: an iroh API gated behind `test-utils` used in the
      # daemon library).
      - name: Prod check (lib + bins, no dev-deps)
        run: cargo check --workspace --lib --bins --locked

      # --locked: fails if Cargo.lock is stale, rather than silently resolving
      # other dependency versions.
      - name: Build
        run: cargo build --workspace --all-targets --locked

      # --all-targets so that Clippy also sees the code in tests/.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Tests run under cargo-nextest, not `cargo test`. nextest schedules
      # *tests* (not per-crate binaries) under one global scheduler, which lets
      # `.config/nextest.toml` (a) cap the co-location-sensitive cross-reactor
      # tests to one-at-a-time via a test group — the macOS kqueue / Windows
      # named-pipe data-channel flake that `--test-threads` could not reach,
      # since that only bounds concurrency *within* a single binary — and
      # (b) retry the rare residual scheduling flake so it never reddens a job
      # or `main`. See that file for the full rationale, including why the
      # OS-clipboard tests are re-serialized by a group (nextest runs each test
      # in its own process, defeating their in-process serialization Mutex).
      - name: Install nextest
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: nextest

      - name: Tests
        run: cargo nextest run --workspace --locked --profile ci

      # nextest does not run doctests — keep them covered with a dedicated step.
      # (`--doc` is mutually exclusive with `--all-targets`, hence its own run.)
      - name: Doctests
        run: cargo test --workspace --doc --locked

      # The real GUI binary is behind `required-features = webview`
      # (its generate_context! embeds ui/dist): --workspace does not cover
      # it — neither for the build nor for Clippy, which silently excludes it
      # from --all-targets. Hence its two dedicated steps: linting main.rs,
      # then linking against the real webview engine.
      - name: Clippy GUI (webview)
        run: cargo clippy -p universallink-gui --features webview --all-targets --locked -- -D warnings

      - name: Build GUI (webview)
        run: cargo build -p universallink-gui --features webview --locked

  # The Android app. Nothing else in this file compiles it: `gui-mobile` is
  # EXCLUDED from the workspace (root Cargo.toml), so `--workspace` never reaches
  # its Rust, and its Kotlin is seen by no job at all — a change in `gui`, `core`,
  # `client` or `daemon` could break the phone app and leave this workflow green.
  #
  # Its own job rather than a leg of the matrix above: a different target triple
  # (so nothing to share with the matrix's compilation cache), a whole extra
  # toolchain (JDK, Android SDK/NDK, Gradle), and it only ever runs on Linux.
  android:
    name: android
    runs-on: ubuntu-latest
    # Cold, this compiles the tauri + iroh tree for aarch64-linux-android and
    # builds two cargo tools from source. Same 45 min as the matrix.
    timeout-minutes: 45
    env:
      # The NDK the app was developed and device-validated against, pinned like
      # every other version in this file: the runner image ships whichever NDK it
      # ships, and that moves from one image release to the next. This is a
      # pinned set dependabot cannot refresh — it has no Android-SDK ecosystem —
      # so it is bumped by hand.
      NDK_VERSION: "26.3.11579264"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.97.0"
          target: aarch64-linux-android
          components: clippy
          rustflags: ""
          # `gui-mobile` is its own cargo workspace with its own target/; the
          # default (`. -> target`) would cache the workspace's, which this job
          # never writes to. `~/.tools` holds the two cargo-installed binaries
          # below — a deliberately separate --root, so the cache never carries
          # rustup's own shims in ~/.cargo/bin.
          cache-workspaces: "gui-mobile -> target"
          cache-directories: "~/.tools"

      # AGP 8.11 needs JDK 17+; 21 is what the app is developed against. Before
      # the SDK step, which runs sdkmanager — itself a Java program.
      #
      # Deliberately WITHOUT `cache: gradle`: a Gradle cache runs to hundreds of
      # megabytes, the repository's cache budget is shared, and evicting the
      # matrix jobs' compilation caches would cost far more than the one or two
      # minutes Gradle spends fetching AGP and androidx here.
      - name: Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      # Installing a component the image already carries is a no-op, so pinning
      # costs nothing beyond the NDK download.
      - name: Android SDK components
        run: |
          # sdkmanager is not on PATH on the runner; take the newest cmdline-tools.
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/ui/package-lock.json

      # The build, not just `npm ci`, and it has to come before the Rust steps:
      # gui-mobile's generate_context! resolves `frontendDist`
      # (../gui/ui/dist-mobile) AT COMPILE TIME and its proc macro panics if the
      # directory is absent — which it is on a checkout, dist-mobile being
      # generated. The tauri CLI would produce it from `beforeBuildCommand`, but
      # the clippy step below does not go through the CLI. The CLI reruns this
      # later; it is cheap (seconds) and idempotent.
      - name: Frontend
        working-directory: gui/ui
        shell: bash
        run: |
          npm ci
          npm run build:mobile

      # cargo-installed rather than fetched by an action: taiki-e/install-action
      # (already pinned above for nextest) lists neither of these among the tools
      # it can supply. `~/.tools` is cached by the toolchain step, and
      # `cargo install` exits 0 with "already installed" on a hit, so on a warm
      # cache this step costs an index refresh.
      #
      # cargo-ndk serves the clippy step alone: it exports the NDK's clang and ar
      # for the target, which the build scripts of the tree need (`ring` compiles
      # asm for aarch64). The tauri CLI drives Gradle and, more importantly,
      # generates the Gradle inputs that a checkout does not carry (below).
      - name: Android build tools
        run: |
          cargo install cargo-ndk --version "^4.1" --locked --root ~/.tools
          cargo install tauri-cli --version "^2.0" --locked --root ~/.tools
          echo "$HOME/.tools/bin" >> "$GITHUB_PATH"

      # The only pass that lints gui-mobile's own Rust, and the only one that even
      # COMPILES the `target_os = "android"` arms of the workspace crates
      # (`paths`, `daemon::config`) — the matrix above cannot reach either.
      - name: Clippy (aarch64-linux-android)
        working-directory: gui-mobile
        run: cargo ndk -t arm64-v8a clippy --locked -- -D warnings

      # A committed gen/android is NOT self-sufficient. `settings.gradle` does
      # `apply from: 'tauri.settings.gradle'`, and that file is gitignored because
      # it is machine-specific: it holds ABSOLUTE paths into ~/.cargo/registry.
      # Same for app/tauri.properties (the versionCode), app/proguard-tauri.pro,
      # app/src/main/assets/tauri.conf.json and the whole generated/ Kotlin
      # (WryActivity, RustWebView, …).
      #
      # What `init` does to files that already exist, exactly (the rule is in
      # tauri-cli, src/mobile/android/project.rs): it FORCE-REWRITES one — the
      # buildSrc BuildTask.kt — and skips every other. So our MainActivity,
      # build.gradle.kts, manifest, resources and Kotlin sources are safe, and
      # BuildTask.kt is a no-op only because we have never modified it. That one
      # exception is not a detail: it is why the Android build cannot move to
      # Gradle 9, which removed the `Project.exec` that BuildTask.kt calls — any
      # local patch would be erased right here, on every run. See the version caps
      # in .github/dependabot.yml.
      - name: Generate the Gradle project
        working-directory: gui-mobile
        run: cargo tauri android init --skip-targets-install

      # The RELEASE variant, deliberately, not `--debug`:
      #   * it is the shipping configuration, and the only one R8 runs on
      #     (isMinifyEnabled is set on that buildType alone), so it is the only
      #     one that exercises app/proguard-rules.pro;
      #   * a debug APK weighs 810 MiB against release's 36, all Rust symbols.
      # It builds UNSIGNED — the signing key belongs to release.yml — so nothing
      # is uploaded here. This step is a gate, not a producer.
      #
      # `--target aarch64`: the default is all FOUR ABIs, i.e. four Rust builds
      # where every modern phone uses one. `--apk`: the default also emits an AAB,
      # which only the Play Store consumes.
      - name: Build the APK (release, unsigned)
        working-directory: gui-mobile
        run: cargo tauri android build --apk --target aarch64

  # Dependency policy: security advisories, duplicates, crate provenance,
  # licenses. A separate job rather than a matrix step — the dependency
  # graph does not depend on the platform, and the action is a Docker
  # action, so it only runs on a Linux runner.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # All four checks, `licenses` included: the allow-list is in deny.toml.
      - name: Dependency policy (workspace)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories bans sources licenses

      # The mobile shell is excluded from the workspace (gui-mobile/Cargo.toml), so
      # the step above — which reads ./Cargo.toml — never sees its lockfile, and
      # that lockfile is NOT a subset of the workspace one: it resolved ~80 crates
      # to higher versions, plus a `syn 3` the workspace does not carry. Those
      # versions were therefore audited by nobody. Same deny.toml, so a single
      # policy governs both trees.
      - name: Dependency policy (mobile shell)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories bans sources licenses
          manifest-path: ./gui-mobile/Cargo.toml
