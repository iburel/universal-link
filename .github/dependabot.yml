version: 2

# Versions are pinned everywhere (action SHAs, toolchain, Cargo.lock,
# package-lock.json, the Android plugins): without this file, nothing would flag
# that a pinned version has become outdated or vulnerable. Monthly cadence and
# grouped updates, to receive one pull request per set rather than one per
# dependency.
#
# One entry per pinned set, and there are five: the workflow action SHAs, the
# three lockfiles (the workspace's Cargo.lock, gui-mobile's own, and the
# frontend's package-lock.json), and the Android app's Gradle dependencies. A set
# left out here is refreshed by nobody: GitHub's security alerts are the one
# channel this file does not govern, and they report a published advisory, not a
# version that has merely gone stale.
#
# One pinned set is out of reach entirely: the Android SDK platform, build-tools
# and NDK versions, which live in .github/workflows/ci.yml. Dependabot has no
# ecosystem for them, so they are bumped by hand.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      # Major updates are excluded from the group, hence delivered each in its own
      # pull request: a major update requires porting the code, and a batch of
      # four that fails does not tell which one is at fault.
      cargo:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  # The mobile shell is EXCLUDED from the workspace (see gui-mobile/Cargo.toml),
  # so it carries its OWN Cargo.lock, which the `/` entry above never reads. That
  # lock is not a subset of the workspace one either: it resolved later, and it
  # already sits ahead of it (higher versions of ~80 crates, plus a `syn 3` the
  # workspace does not carry). Without this entry it drifts alone.
  - package-ecosystem: cargo
    directory: /gui-mobile
    schedule:
      interval: monthly
    groups:
      cargo-mobile:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  # The frontend lockfile, which no entry covered: postcss sat seven patch
  # releases behind, on a HIGH advisory, before a security alert surfaced it.
  - package-ecosystem: npm
    directory: /gui/ui
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  # The Gradle side of the Android app: the Android Gradle Plugin, the Kotlin
  # plugin, androidx and material, pinned across gui-mobile/gen/android's two
  # build files and its buildSrc. Unlike the sets above there is no lockfile here
  # — the versions are literals in build.gradle.kts, which is exactly why nothing
  # would report them going stale.
  - package-ecosystem: gradle
    directory: /gui-mobile/gen/android
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    # The Android build toolchain is capped, and NOT because we prefer old
    # versions: each of the three is blocked by something in the Tauri templates
    # that we do not get to edit. Without these entries the same three
    # unmergeable pull requests come back every month.
    #
    # Expressed as update-types rather than version ranges on purpose. The Kotlin
    # cap is the reason: 2.3 is a MINOR from the 2.2.21 we pin, so it would be
    # swept into the `gradle` group above (minor + patch) and quietly break the
    # build again inside an otherwise routine PR — an ignore keyed on major
    # versions would not have caught it. Ignores are applied before grouping, so
    # these hold for the group as well as for individual PRs.
    ignore:
      # Patches of 2.2.x only. From 2.3 the Kotlin plugin makes
      # `kotlinOptions { jvmTarget = "..." }` a hard error, and that construct
      # lives not only in gui-mobile/gen/android/app/build.gradle.kts (ours to
      # fix) but in the Gradle scripts of tauri and tauri-plugin-opener, which
      # Gradle reads out of ~/.cargo/registry. Lift when a published tauri has
      # migrated those to the compilerOptions DSL.
      - dependency-name: "org.jetbrains.kotlin:kotlin-gradle-plugin"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # 8.x only. AGP 9 requires Gradle >= 9.5, which we cannot take (below), and
      # then still fails on buildSrc/.../BuildTask.kt.
      - dependency-name: "com.android.tools.build:gradle"
        update-types:
          - version-update:semver-major
      # 8.x only. Gradle 9 removed `Project.exec`, which BuildTask.kt calls — and
      # that file is the ONE file `cargo tauri android init` force-rewrites on
      # every run (tauri-cli src/mobile/android/project.rs), which CI does on
      # every run, so patching it here is not an option. Lift when a published
      # tauri emits an ExecOperations-based BuildTask.
      - dependency-name: "gradle-wrapper"
        update-types:
          - version-update:semver-major
