version: 2

# Versions are pinned everywhere (action SHAs, toolchain, Cargo.lock,
# package-lock.json, the Android plugins): without this file, nothing would flag
# that a pinned version has become outdated or vulnerable. Monthly cadence and
# grouped updates, to receive one pull request per set rather than one per
# dependency.
#
# One entry per pinned set, and there are five: the workflow action SHAs, the
# three lockfiles (the workspace's Cargo.lock, gui-mobile's own, and the
# frontend's package-lock.json), and the Android app's Gradle dependencies. A set
# left out here is refreshed by nobody: GitHub's security alerts are the one
# channel this file does not govern, and they report a published advisory, not a
# version that has merely gone stale.
#
# One pinned set is out of reach entirely: the Android SDK platform, build-tools
# and NDK versions, which live in .github/workflows/ci.yml. Dependabot has no
# ecosystem for them, so they are bumped by hand.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      # Major updates are excluded from the group, hence delivered each in its own
      # pull request: a major update requires porting the code, and a batch of
      # four that fails does not tell which one is at fault.
      cargo:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  # The mobile shell is EXCLUDED from the workspace (see gui-mobile/Cargo.toml),
  # so it carries its OWN Cargo.lock, which the `/` entry above never reads. That
  # lock is not a subset of the workspace one either: it resolved later, and it
  # already sits ahead of it (higher versions of ~80 crates, plus a `syn 3` the
  # workspace does not carry). Without this entry it drifts alone.
  - package-ecosystem: cargo
    directory: /gui-mobile
    schedule:
      interval: monthly
    groups:
      cargo-mobile:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  # The frontend lockfile, which no entry covered: postcss sat seven patch
  # releases behind, on a HIGH advisory, before a security alert surfaced it.
  - package-ecosystem: npm
    directory: /gui/ui
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  # The Gradle side of the Android app: the Android Gradle Plugin, the Kotlin
  # plugin, androidx and material, pinned across gui-mobile/gen/android's two
  # build files and its buildSrc. Unlike the sets above there is no lockfile here
  # — the versions are literals in build.gradle.kts, which is exactly why nothing
  # would report them going stale.
  - package-ecosystem: gradle
    directory: /gui-mobile/gen/android
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ["*"]
        update-types:
          - minor
          - patch
