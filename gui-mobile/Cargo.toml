# Tauri MOBILE shell of the GUI (spike): the SAME Svelte frontend and the SAME
# `onedevice-gui` bridge as the desktop app, but the Core is embedded
# in-process (Android cannot spawn a separate daemon) and reached over an
# in-process UDS. One UI, one transport (`invoke`), no new core API.
#
# EXCLUDED from the workspace (see the root Cargo.toml): built only for
# aarch64-linux-android via the Tauri Android tooling (cargo-ndk under the
# hood), never by the native CI jobs — so it perturbs neither the workspace
# build (`cargo build --workspace --all-targets`) nor the workspace's
# cargo-deny run. It still path-depends on the workspace crates, so a change
# there can break the phone app without any native job noticing; CI covers that
# with an `android` job of its own (clippy for the phone's triple, then the
# release APK), which is also the only place the Kotlin under gen/android is
# compiled at all.
#
# The exclusion buys that isolation at the price of a SECOND lockfile, and the
# two have since diverged: no new crate NAME enters the tree (every dependency
# below already came in via `gui`, `daemon` or `client`), but this lock resolved
# later and sits ahead of the workspace one — higher versions of ~80 crates,
# plus a `syn 3` the workspace does not carry. Those versions are audited by a
# cargo-deny step of their own (ci.yml, "Dependency policy (mobile shell)") and
# refreshed by a dependabot entry of their own (.github/dependabot.yml); an
# advisory here would otherwise have been reported by nothing but GitHub's
# security alerts.
[package]
name = "onedevice-gui-mobile"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
# staticlib/cdylib for the Android tooling; rlib so a host `cargo check` of this
# crate still works during development.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# `ro.product.model` (= android.os.Build.MODEL) for this phone's device name,
# read from the property store instead of over JNI — see `device_name`. Already
# in the lock (via chrono's iana-time-zone), so no new crate enters the tree.
android_system_properties = "0.1"
anyhow = "1"
# Inline bytes of a materialized clipboard announce travel base64-encoded
# (doc/core-api.md); same crate and version the Core decodes them with. Already
# in the lock via `core`, so no new crate enters the tree.
base64 = "0.22"
serde_json = "1"
tauri = { version = "2", default-features = false, features = [
  "wry",
  "compression",
  # Web inspector (chrome://inspect) — needed to diagnose the mobile webview.
  "devtools",
] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# TLS for the embedded Core's outbound streams (OIDC discovery/token exchange +
# the server WebSocket). Same rustls/ring stack as the daemon, but the trust
# roots are the bundled Mozilla set (webpki-roots) rather than the OS store:
# the desktop daemon's `rustls-platform-verifier` needs a JNI + Kotlin bridge
# and the app Context on Android, and the Core only reaches PUBLIC endpoints
# here. Both crates are already in the lock transitively (via `daemon`/`gui`),
# so no new crate enters the tree. See `src/tls.rs`.
tokio-rustls = { version = "0.26", default-features = false, features = [
  "logging",
  "ring",
  "tls12",
] }
webpki-roots = "1"

# The desktop bridge, reused verbatim (commands + connection relay).
onedevice-gui = { path = "../gui" }
onedevice-ipc-client = { path = "../client" }
# The embedded Core and its production iroh data-plane wiring.
onedevice-core = { path = "../core" }
onedevice-daemon = { path = "../daemon" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
