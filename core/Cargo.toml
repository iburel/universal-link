[package]
name = "universallink-core"
version = "0.5.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1"
# PKCE: code_verifier and state as base64url, S256 challenge.
base64 = "0.22"
# Device identity (= iroh identity): generated on first startup
# (`rand_core`) and used to sign proofs of possession.
#
# This used to be `=3.0.0-rc.0`, an EXACT pin, because iroh-base locked that
# release candidate and a caret requirement does not match a pre-release: the two
# would not unify. iroh has since moved on — iroh-base asks for
# `>=3.0.0-rc.0, <4.0.0` — so the exact pin has lost its reason to exist and goes
# back to an ordinary requirement, which lets a 3.0.x patch through without a
# manual bump. Keep it identical in server and test-support.
#
# The seed this crate reads and writes is PERSISTED (see identity.rs) and the
# account key is DERIVED FROM THE RECOVERY CODE (account_key.rs), so a change in
# `to_bytes`/`from_bytes` semantics would strand every enrolled device and
# invalidate every code ever issued. The round-trip tests cannot see that — both
# ends move together — so there are fixed vectors in account_key.rs instead.
ed25519-dalek = { version = "3", features = ["rand_core"] }
# Encoding/decoding of OIDC query strings and form bodies.
form_urlencoded = "1"
futures-util = "0.3"
hex = "0.4"
rand = "0.10"
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
# Logging: the library only EMITS (100% Rust, cross-compiles). The
# daemon installs the collector; without it the events are dropped.
tracing = "0.1"
# WebSocket handshake ONLY: the stream is opened by the config's `Connector`
# (`client_async`), never by `connect_async`. Without `connect`, the library
# has neither `MaybeTlsStream` nor any TLS stack — this is what keeps it
# cross-checkable from Linux (no C build.rs).
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
] }
x25519-dalek = "3"
chacha20poly1305 = "0.11"
hkdf = "0.13"

[target.'cfg(unix)'.dependencies]
# Peer verification (uid): compare the socket's uid against our own.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Named pipe DACL (current user's SID) + client pid.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Already a normal dependency (above) and in the lock; re-declared here so the
# integration-test crate can base64-encode materialized clipboard blobs.
base64 = "0.22"
tempfile = "3"
universallink-server = { path = "../server" }
universallink-test-support = { path = "../test-support" }
