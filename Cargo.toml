[workspace]
resolver = "3"
members = ["client", "clipboard", "core", "daemon", "gui", "paths", "server", "server-daemon", "test-support", "tray"]
# The Android client's Rust cdylib (`gui-mobile`: the Tauri-mobile shell — the
# desktop Svelte UI + an embedded Core). Excluded from the workspace: built only
# for aarch64-linux-android via the Tauri Android tooling (cargo-ndk under the
# hood), never by the native CI jobs, so it perturbs neither the workspace build
# nor cargo-deny. It still path-depends on the workspace crates, which is why a
# change here can break it — CI has its own `android` job for that (ci.yml).
exclude = ["gui-mobile"]
